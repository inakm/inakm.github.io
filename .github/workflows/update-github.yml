name: Update GitHub activity

# Refreshes assets/data/github.json for the homepage "05 / Open Source"
# section. The generator prefers GitHub's public contributions page (no token,
# full year), falls back to GraphQL using the Action's GITHUB_TOKEN, and
# finally to the ~90 day public events feed.

on:
  schedule:
    # Daily at 05:17 UTC (off the top of the hour to avoid the cron rush).
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-github
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate assets/data/github.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node tools/generate-github.js

      - name: Commit changes
        run: |
          if git diff --quiet -- assets/data/github.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/github.json
          git commit -m "chore: refresh GitHub activity data"
          git push
